<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A5C36"/>
      <stop offset="100%" stop-color="#064526"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F9D58"/>
      <stop offset="100%" stop-color="#0A7A44"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#9A7209"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F9D58"/>
      <stop offset="100%" stop-color="#0A7A44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="440" rx="24" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="520" height="48" rx="24" fill="#ffffff10"/>
  <rect x="0" y="24" width="520" height="24" fill="#ffffff10"/>
  <circle cx="28" cy="24" r="8" fill="#ffffff20"/>
  <rect x="44" y="20" width="80" height="8" rx="4" fill="#ffffff30"/>
  <rect x="380" y="20" width="24" height="8" rx="4" fill="#ffffff20"/>
  <rect x="412" y="20" width="24" height="8" rx="4" fill="#ffffff20"/>
  <rect x="444" y="16" width="56" height="16" rx="8" fill="#0F9D58"/>

  <!-- Sidebar -->
  <rect x="0" y="48" width="48" height="392" fill="#ffffff08"/>
  <rect x="12" y="72" width="24" height="24" rx="6" fill="#0F9D58"/>
  <rect x="12" y="112" width="24" height="24" rx="6" fill="#ffffff15"/>
  <rect x="12" y="152" width="24" height="24" rx="6" fill="#ffffff15"/>
  <rect x="12" y="192" width="24" height="24" rx="6" fill="#ffffff15"/>
  <rect x="12" y="232" width="24" height="24" rx="6" fill="#ffffff15"/>

  <!-- Stat Cards -->
  <rect x="68" y="68" width="104" height="80" rx="12" fill="url(#card1)" filter="url(#shadow)"/>
  <circle cx="104" cy="100" r="12" fill="#ffffff20"/>
  <rect x="90" y="96" width="28" height="4" rx="2" fill="#ffffff20"/>
  <rect x="82" y="120" width="76" height="6" rx="3" fill="#ffffff"/><rect x="82" y="132" width="48" height="4" rx="2" fill="#ffffff60"/>

  <rect x="184" y="68" width="104" height="80" rx="12" fill="url(#card2)" filter="url(#shadow)"/>
  <circle cx="220" cy="100" r="12" fill="#ffffff20"/>
  <rect x="206" y="96" width="28" height="4" rx="2" fill="#ffffff20"/>
  <rect x="198" y="120" width="76" height="6" rx="3" fill="#ffffff"/><rect x="198" y="132" width="48" height="4" rx="2" fill="#ffffff60"/>

  <rect x="300" y="68" width="104" height="80" rx="12" fill="url(#card3)" filter="url(#shadow)"/>
  <circle cx="336" cy="100" r="12" fill="#ffffff20"/>
  <rect x="322" y="96" width="28" height="4" rx="2" fill="#ffffff20"/>
  <rect x="314" y="120" width="76" height="6" rx="3" fill="#ffffff"/><rect x="314" y="132" width="48" height="4" rx="2" fill="#ffffff60"/>

  <rect x="416" y="68" width="84" height="80" rx="12" fill="url(#card4)" filter="url(#shadow)"/>
  <circle cx="442" cy="100" r="12" fill="#ffffff20"/>
  <rect x="428" y="96" width="28" height="4" rx="2" fill="#ffffff20"/>
  <rect x="430" y="120" width="56" height="6" rx="3" fill="#ffffff"/><rect x="430" y="132" width="36" height="4" rx="2" fill="#ffffff60"/>

  <!-- Section Title -->
  <rect x="68" y="168" width="120" height="6" rx="3" fill="#ffffff40"/>
  <rect x="68" y="180" width="80" height="4" rx="2" fill="#ffffff20"/>

  <!-- Table -->
  <rect x="68" y="200" width="432" height="160" rx="12" fill="#ffffff08" stroke="#ffffff10" stroke-width="1"/>

  <!-- Table header -->
  <rect x="68" y="200" width="432" height="32" rx="12" fill="#ffffff08"/>
  <rect x="84" y="212" width="60" height="6" rx="3" fill="#ffffff40"/>
  <rect x="164" y="212" width="80" height="6" rx="3" fill="#ffffff40"/>
  <rect x="264" y="212" width="100" height="6" rx="3" fill="#ffffff40"/>
  <rect x="384" y="212" width="60" height="6" rx="3" fill="#ffffff40"/>

  <!-- Table rows -->
  <rect x="84" y="248" width="8" height="8" rx="4" fill="#0F9D58"/>
  <rect x="104" y="250" width="50" height="4" rx="2" fill="#ffffff50"/>
  <rect x="172" y="250" width="70" height="4" rx="2" fill="#ffffff50"/>
  <rect x="284" y="250" width="90" height="4" rx="2" fill="#ffffff50"/>
  <rect x="394" y="248" width="40" height="6" rx="3" fill="#0F9D5840"/>

  <rect x="84" y="280" width="8" height="8" rx="4" fill="#B8860B"/>
  <rect x="104" y="282" width="45" height="4" rx="2" fill="#ffffff50"/>
  <rect x="172" y="282" width="80" height="4" rx="2" fill="#ffffff50"/>
  <rect x="284" y="282" width="60" height="4" rx="2" fill="#ffffff50"/>
  <rect x="394" y="280" width="40" height="6" rx="3" fill="#B8860B40"/>

  <rect x="84" y="312" width="8" height="8" rx="4" fill="#0F9D58"/>
  <rect x="104" y="314" width="55" height="4" rx="2" fill="#ffffff50"/>
  <rect x="172" y="314" width="65" height="4" rx="2" fill="#ffffff50"/>
  <rect x="284" y="314" width="80" height="4" rx="2" fill="#ffffff50"/>
  <rect x="394" y="312" width="40" height="6" rx="3" fill="#0F9D5840"/>

  <rect x="84" y="344" width="8" height="8" rx="4" fill="#0F9D58"/>
  <rect x="104" y="346" width="48" height="4" rx="2" fill="#ffffff50"/>
  <rect x="172" y="346" width="75" height="4" rx="2" fill="#ffffff50"/>
  <rect x="284" y="346" width="70" height="4" rx="2" fill="#ffffff50"/>
  <rect x="394" y="344" width="40" height="6" rx="3" fill="#0F9D5840"/>

  <!-- Decorative dots -->
  <circle cx="480" cy="400" r="2" fill="#ffffff15"/>
  <circle cx="492" cy="400" r="2" fill="#ffffff15"/>
  <circle cx="504" cy="400" r="2" fill="#ffffff15"/>

  <!-- Decorative glow -->
  <circle cx="260" cy="220" r="180" fill="#0F9D58" opacity="0.04" filter="url(#glow)"/>
</svg>
